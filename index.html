<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【接案人生研究所 Vol.2】你的專業，到底值多少錢？</title>
    <style>
        :root {
            --bg-color: #F4EFEB;
            --card-bg: #FFFFFF;
            --primary-text: #4A3B32;
            --accent-warm: #C88A58;
            --accent-light: #F9F3EA;
            --border-color: #E6DCD3;
            --tag-bg: #EAE0D5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-text);
            line-height: 1.7;
            padding: 20px 10px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(74, 59, 50, 0.08);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* EDM 主視覺圖片區塊 */
        .banner-image-container {
            width: 100%;
            background: #EFE8DF;
            text-align: center;
        }

        .banner-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .content-body {
            padding: 30px 25px;
        }

        /* 痛點引言卡片 */
        .quote-card {
            background: var(--accent-light);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid var(--accent-warm);
        }

        .quote-card p {
            font-size: 0.98rem;
            color: var(--primary-text);
            margin-bottom: 8px;
        }

        /* 活動資訊欄 */
        .event-info-bar {
            background: var(--primary-text);
            color: white;
            border-radius: 12px;
            padding: 18px 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 25px 0;
            font-size: 0.9rem;
        }

        .event-info-item span {
            opacity: 0.8;
            font-size: 0.8rem;
            display: block;
        }

        /* 引導按鈕 */
        .action-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px dashed var(--border-color);
            text-align: center;
        }

        .btn-action {
            display: inline-block;
            width: 100%;
            background: var(--accent-warm);
            color: white;
            text-decoration: none;
            padding: 15px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(200, 138, 88, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn-action:hover {
            background: #B37747;
        }

        @media (max-width: 480px) {
            .event-info-bar { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 置頂 EDM 主視覺圖片 -->
    <div class="banner-image-container">
        <!-- 請將 src 裡面的圖片檔名替換成你在 GitHub 上傳的圖片名稱（例如 edm.jpg） -->
        <img src="edm.jpg" alt="接案人生研究所 Vol.2" class="banner-image">
    </div>

    <div class="content-body">
        <!-- 2. 精簡文字與引言 -->
        <div class="quote-card">
            <p><strong>「這個案子，我到底要報多少？」</strong></p>
            <p style="margin-bottom: 0;">報高了怕客戶跑掉，報低了又怕做到懷疑人生 😂<br>這一次，我們就來聊聊：接案，到底該怎麼報價？</p>
        </div>

        <!-- 3. 活動重點摘要 -->
        <div class="event-info-bar">
            <div class="event-info-item">
                <span>📅 聚會時間</span>
                <strong>9/23（三）14:00</strong>
            </div>
            <div class="event-info-item">
                <span>📍 聚會地點</span>
                <strong>台北捷運站附近</strong>
            </div>
            <div class="event-info-item">
                <span>💰 聚會費用</span>
                <strong>NT$200</strong>
            </div>
            <div class="event-info-item">
                <span>🤝 聚會形式</span>
                <strong>推薦制（每月一題）</strong>
            </div>
        </div>

        <p style="text-align: center; font-style: italic; font-size: 0.9rem; color: #666; margin-bottom: 20px;">
            "接案的人生，一起研究，一起走得更遠。"
        </p>

        <!-- 4. 私訊按鈕 -->
        <div class="action-section">
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">
                本聚會為推薦邀約制，若想參與請私訊主辦人或引薦朋友。
            </p>
            <button class="btn-action" onclick="alert('本活動為邀約推薦制，請直接私訊引薦您的朋友或主辦人報名喔！')">
                💬 私訊主辦人報名聚會
            </button>
        </div>
    </div>
</div>

</body>
</html>
